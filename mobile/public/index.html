<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>SyncServ</title>
    <meta name="description" content="SyncServ: agenda, comanda e gestão do seu negócio, com atendimento pelo WhatsApp." />
    <meta name="theme-color" content="#0F172A" />
    <meta name="referrer" content="no-referrer" />
    <!-- App de gestão: não deve aparecer em buscadores -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SyncServ" />
    <link rel="stylesheet" href="/web.css" />
  </head>
  <body>
    <noscript>O SyncServ precisa do JavaScript ativado no navegador.</noscript>
    <!-- Abertura em HTML (a mesma da splash do app): aparece antes do JavaScript, que a substitui ao montar -->
    <div id="root"><div class="abertura"><img src="/icons/logo-vertical.svg" alt="SyncServ, carregando" width="180" height="170" /></div></div>
  </body>
</html>
