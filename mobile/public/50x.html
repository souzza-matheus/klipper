<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SyncServ fora do ar</title>
    <!-- Página que o Caddy mostra (com o status 5xx de verdade) quando o próprio servidor falha.
         Sem <style> nem script inline: o CSP não libera (estilo em /erro.css). -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0F172A" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="stylesheet" href="/erro.css" />
  </head>
  <body>
    <main class="erro">
      <img src="/icons/favicon.svg" alt="" width="56" height="56" />
      <h1>O SyncServ está com um problema</h1>
      <p>Não foi possível abrir o app agora. Tente de novo em alguns minutos.</p>
      <a class="botao" href="/">Tentar de novo</a>
    </main>
  </body>
</html>
